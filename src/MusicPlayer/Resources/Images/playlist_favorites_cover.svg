<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Основной фоновый градиент из Colors.xaml (#7C1919 -> #450F12 -> #0B0B0E) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C1919" />
      <stop offset="52%" stop-color="#360D11" />
      <stop offset="100%" stop-color="#0B0B0E" />
    </linearGradient>

    <!-- Мягкое радиальное свечение за сердцем -->
    <radialGradient id="centerGlow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#FF3B30" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#7C1919" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0B0B0E" stop-opacity="0" />
    </radialGradient>

    <!-- Градиент для контура и блика сердца -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2D4D4" />
    </linearGradient>

    <!-- Тень под сердцем -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Фон -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  <rect width="512" height="512" fill="url(#centerGlow)" />

  <!-- Декоративные звуковые волны в стиле FluentMusic -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M -30 335 C 75 275, 165 395, 265 335 C 365 275, 445 385, 542 330" stroke-width="2.5" stroke-opacity="0.09" />
    <path d="M -30 365 C 85 305, 175 425, 275 365 C 375 305, 455 415, 542 360" stroke-width="2" stroke-opacity="0.06" />
    <path d="M -30 175 C 90 225, 180 125, 280 175 C 380 225, 455 135, 542 180" stroke-width="2" stroke-opacity="0.06" />
  </g>



  <!-- Иконка сердца (геометрия согласована с player_heart_active.svg) -->
  <g transform="translate(152, 160) scale(8.66)" filter="url(#softShadow)">
    <path d="M 12 21.35 L 10.55 20.03 C 5.4 15.36 2 12.28 2 8.5 C 2 5.42 4.42 3 7.5 3 C 9.24 3 10.91 3.81 12 5.09 C 13.09 3.81 14.76 3 16.5 3 C 19.58 3 22 5.42 22 8.5 C 22 12.28 18.6 15.36 13.45 20.04 L 12 21.35 Z" fill="url(#heartGrad)" />
  </g>

  <!-- Тонкая внутренняя рамка по периметру обложки -->
  <rect x="0.75" y="0.75" width="510.5" height="510.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />
</svg>